<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy: restringe origens de scripts, estilos e fontes -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: https://placehold.co; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

    <title>Local Storage | LogicJS.Lab</title>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/local-storage.svg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
</head>

<body
    class="bg-bg-primary text-text-primary min-h-screen flex items-center justify-center px-4 pb-6 pt-24 sm:px-6 sm:pb-8 sm:pt-6 relative font-main">

    <!-- Botão Voltar -->
    <a href="../index.html"
        class="fixed top-4 left-4 sm:top-6 sm:left-6 inline-flex items-center gap-2 bg-bg-secondary border border-border-color px-4 py-3 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <main class="w-full max-w-2xl">
        <section class="bg-bg-secondary border border-border-color rounded-2xl shadow-xl p-6 sm:p-8">

            <!-- Cabeçalho -->
            <header class="text-center mb-6 sm:mb-8">
                <i class="ph ph-floppy-disk text-4xl text-accent mb-3"></i>
                <h1 class="text-2xl sm:text-3xl font-bold mb-2">Local Storage</h1>
                <p class="text-text-secondary text-sm sm:text-base">
                    Sua lista de tarefas fica salva no navegador, mesmo depois de recarregar a página.
                </p>
            </header>

            <!-- Formulário de nova tarefa -->
            <form id="form-tarefa" class="space-y-3">
                <label for="input-tarefa" class="block text-xs font-semibold text-text-secondary uppercase tracking-wide">
                    Nova tarefa
                </label>

                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="input-tarefa" name="tarefa" maxlength="120" autocomplete="off"
                        placeholder="Ex: Estudar localStorage"
                        class="w-full min-w-0 flex-1 bg-bg-primary border border-border-color text-text-primary px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-all duration-300 placeholder:text-text-secondary/50">

                    <button type="submit" id="btn-adicionar"
                        class="inline-flex items-center justify-center gap-2 min-h-[44px] bg-accent text-bg-primary font-bold px-6 py-3 rounded-xl hover:bg-accent-hover transition-colors duration-200">
                        <i class="ph ph-plus text-lg"></i>
                        Adicionar
                    </button>
                </div>
            </form>

            <!-- Status da lista -->
            <div class="flex flex-wrap items-center justify-between gap-2 mt-6 mb-3">
                <h2 class="text-xs font-semibold text-text-secondary uppercase tracking-wide">Suas tarefas</h2>
                <span id="contador-tarefas" class="text-xs text-text-secondary">Nenhuma tarefa cadastrada</span>
            </div>

            <!-- Lista de tarefas -->
            <ul id="lista-tarefas" class="space-y-3"></ul>

            <!-- Estado vazio -->
            <div id="estado-vazio"
                class="text-center py-10 text-text-secondary border border-dashed border-border-color rounded-xl">
                <i class="ph ph-clipboard-text text-4xl block mb-3 text-text-secondary/60"></i>
                <p class="text-sm">
                    Nenhuma tarefa por aqui ainda.<br>
                    Adicione a primeira acima!
                </p>
            </div>

            <!-- Aviso de persistência -->
            <p class="mt-6 text-xs text-text-secondary text-center break-words">
                Os dados ficam salvos no <span class="text-accent font-semibold">localStorage</span> apenas deste navegador.
            </p>
        </section>
    </main>

    <script src="./script.js"></script>
</body>

</html>
