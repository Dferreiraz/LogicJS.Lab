<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy: restringe origens de scripts, estilos e fontes -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: https://placehold.co; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Manipulação DOM | LogicJS.Lab</title>
    <link rel="shortcut icon" href="../shared/assets/manipulacao-dom.svg" type="image/x-icon">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex items-center justify-center px-4 pb-6 pt-24 sm:px-6 sm:pb-8 sm:pt-6 relative font-main transition-colors duration-500" id="main-body">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-4 left-4 sm:top-6 sm:left-6 inline-flex items-center gap-2 bg-bg-secondary border border-border-color px-4 py-3 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="w-full max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Elemento Alvo (O que será manipulado) -->
        <div class="flex flex-col items-center justify-center gap-6">
            <div id="demo-card" class="bg-bg-secondary border border-border-color p-6 sm:p-8 rounded-2xl shadow-xl w-full text-center transition-all duration-300 transform">
                <h1 id="title" class="text-2xl sm:text-3xl font-bold mb-4 text-accent transition-colors">DOM Master</h1>
                <p id="paragraph" class="text-text-secondary text-base sm:text-lg leading-relaxed transition-all">
                    Este elemento está esperando para ser manipulado pelo JavaScript Vanilla.
                </p>
                <div class="mt-6 flex justify-center">
                    <img id="demo-img" src="https://placehold.co/150x150/1e293b/f7df1e?text=JS+DOM" alt="Demo" class="rounded-lg border border-border-color transition-all duration-300 max-w-full h-auto">
                </div>
            </div>
            
            <!-- Status Atual -->
            <div class="bg-black/30 p-3 rounded-lg text-xs font-mono text-green-400 w-full break-words">
                > Estado atual: <span id="status-log">Padrão</span>
            </div>
        </div>

        <!-- Painel de Controles -->
        <div class="bg-bg-secondary border border-border-color rounded-xl p-6 flex flex-col gap-4 h-fit">
            <h2 class="text-xl text-accent flex items-center gap-2"><i class="ph ph-sliders"></i> Controles DOM</h2>
            
            <div class="space-y-3">
                <button type="button" data-color="red" class="w-full bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 py-3 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-paint-brush"></i> Tema Vermelho
                </button>
                <button type="button" data-color="green" class="w-full bg-green-500/10 border border-green-500/30 text-green-400 hover:bg-green-500/20 py-3 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-paint-brush"></i> Tema Verde
                </button>
                <button type="button" data-color="blue" class="w-full bg-blue-500/10 border border-blue-500/30 text-blue-400 hover:bg-blue-500/20 py-3 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-paint-brush"></i> Tema Azul
                </button>
                
                <hr class="border-border-color my-2">
                
                <button type="button" id="btn-toggle-text" class="w-full bg-bg-primary border border-border-color hover:border-accent py-3 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-text-t"></i> Alternar Texto
                </button>
                <button type="button" id="btn-toggle-size" class="w-full bg-bg-primary border border-border-color hover:border-accent py-3 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-arrows-out"></i> Alternar Tamanho
                </button>
            </div>

            <div class="mt-4 pt-4 border-t border-border-color">
                <p class="text-xs text-text-secondary text-center">
                    Dica: Tente pressionar as teclas <kbd class="bg-bg-primary px-1 rounded border border-border-color">R</kbd>, <kbd class="bg-bg-primary px-1 rounded border border-border-color">G</kbd> ou <kbd class="bg-bg-primary px-1 rounded border border-border-color">B</kbd> no teclado!
                </p>
            </div>
        </div>
    </div>

    <script src="../shared/logger.js"></script>
    <script src="./script.js"></script>
</body>
</html>
