<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação DOM | LogicJS.Lab</title>
    <link rel="shortcut icon" href="./assets/img/favicon.svg" type="image/x-icon">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0f172a',
                        'bg-secondary': '#1e293b',
                        'text-primary': '#f8fafc',
                        'accent': '#F7DF1E',
                        'border-color': '#334155',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex items-center justify-center p-6 relative font-main transition-colors duration-500" id="main-body">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-6 left-6 inline-flex items-center gap-2 bg-bg-secondary border border-border-color px-4 py-2 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="w-full max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Elemento Alvo (O que será manipulado) -->
        <div class="flex flex-col items-center justify-center gap-6">
            <div id="demo-card" class="bg-bg-secondary border border-border-color p-8 rounded-2xl shadow-xl w-full text-center transition-all duration-300 transform">
                <h1 id="title" class="text-3xl font-bold mb-4 text-accent transition-colors">DOM Master</h1>
                <p id="paragraph" class="text-text-secondary text-lg leading-relaxed transition-all">
                    Este elemento está esperando para ser manipulado pelo JavaScript Vanilla.
                </p>
                <div class="mt-6 flex justify-center">
                    <img id="demo-img" src="https://placehold.co/150x150/1e293b/38bdf8?text=JS+DOM" alt="Demo" class="rounded-lg border border-border-color transition-all duration-300">
                </div>
            </div>
            
            <!-- Status Atual -->
            <div class="bg-black/30 p-3 rounded-lg text-xs font-mono text-green-400 w-full">
                > Estado atual: <span id="status-log">Padrão</span>
            </div>
        </div>

        <!-- Painel de Controles -->
        <div class="bg-bg-secondary border border-border-color rounded-xl p-6 flex flex-col gap-4 h-fit">
            <h2 class="text-xl text-accent flex items-center gap-2"><i class="ph ph-sliders"></i> Controles DOM</h2>
            
            <div class="space-y-3">
                <button onclick="changeColor('red')" class="w-full bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 py-2 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-paint-brush"></i> Tema Vermelho
                </button>
                <button onclick="changeColor('green')" class="w-full bg-green-500/10 border border-green-500/30 text-green-400 hover:bg-green-500/20 py-2 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-paint-brush"></i> Tema Verde
                </button>
                <button onclick="changeColor('blue')" class="w-full bg-blue-500/10 border border-blue-500/30 text-blue-400 hover:bg-blue-500/20 py-2 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-paint-brush"></i> Tema Azul
                </button>
                
                <hr class="border-border-color my-2">
                
                <button onclick="toggleText()" class="w-full bg-bg-primary border border-border-color hover:border-accent py-2 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-text-t"></i> Alternar Texto
                </button>
                <button onclick="toggleSize()" class="w-full bg-bg-primary border border-border-color hover:border-accent py-2 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-arrows-out"></i> Alternar Tamanho
                </button>
            </div>

            <div class="mt-4 pt-4 border-t border-border-color">
                <p class="text-xs text-text-secondary text-center">
                    Dica: Tente pressionar as teclas <kbd class="bg-bg-primary px-1 rounded border border-border-color">R</kbd>, <kbd class="bg-bg-primary px-1 rounded border border-border-color">G</kbd> ou <kbd class="bg-bg-primary px-1 rounded border border-border-color">B</kbd> no teclado!
                </p>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
