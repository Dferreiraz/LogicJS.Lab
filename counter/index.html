<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy: restringe origens de scripts, estilos e fontes -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: https://placehold.co; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Counter | LogicJS.Lab</title>
    <link rel="shortcut icon" href="../shared/assets/counter.svg" type="image/x-icon">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex items-center justify-center px-4 pb-6 pt-24 sm:px-6 sm:pb-8 sm:pt-6 relative">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-4 left-4 sm:top-6 sm:left-6 inline-flex items-center gap-2 bg-bg-secondary border border-border-color px-4 py-3 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="bg-bg-secondary border border-border-color p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
        <i class="ph ph-plus-minus text-5xl text-accent mb-4"></i>
        <h1 class="text-2xl font-bold mb-6">The Counter</h1>
        
        <!-- ID "value" preservado -->
        <div id="value" class="text-5xl sm:text-6xl font-bold text-text-primary mb-8 font-mono">0</div>
        
        <div class="flex justify-center gap-4">
            <!-- IDs preservados exatamente como no script -->
            <button type="button" id="btn-decrease" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 p-3 rounded-lg font-bold transition w-16 min-h-[44px] text-xl">-</button>
            <button type="button" id="btn-reset" class="bg-bg-primary border border-border-color hover:border-accent text-text-primary p-3 rounded-lg font-bold transition w-16 min-h-[44px] text-sm">Reset</button>
            <button type="button" id="btn-increase" class="bg-accent text-bg-primary hover:bg-accent-hover p-3 rounded-lg font-bold transition w-16 min-h-[44px] text-xl">+</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
