    <circle cx="12" cy="15" r="5.5"/>
    <circle cx="19.5" cy="13.5" r="6.5"/>
    <rect x="8" y="15" width="16" height="6" rx="3"/>
  </g>
  <!-- Seta para baixo: representa o download dos dados (fetch) -->
