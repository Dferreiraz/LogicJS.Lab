<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy: restringe origens de scripts, estilos e fontes -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: https://placehold.co; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Funções | LogicJS.Lab</title>
    <link rel="shortcut icon" href="../shared/assets/funcoes.svg" type="image/x-icon">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex items-center justify-center px-4 pb-6 pt-24 sm:px-6 sm:pb-8 sm:pt-6 relative font-mono">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-4 left-4 sm:top-6 sm:left-6 inline-flex items-center gap-2 bg-bg-secondary border border-border-color px-4 py-3 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Área do Código -->
        <div class="bg-code-bg border border-border-color rounded-xl p-6 shadow-xl overflow-hidden">
            <h2 class="text-xl mb-4 text-accent flex items-center gap-2">
                <i class="ph ph-code"></i> script.js
            </h2>
            <pre class="text-sm leading-relaxed text-slate-300 overflow-x-auto">
<span class="text-keyword">function</span> <span class="text-function-name">triplo</span>(n) {
    <span class="text-keyword">return</span> n * <span class="text-number">3</span>;
}

<span class="text-keyword">function</span> <span class="text-function-name">nomeCompleto</span>(nome, sobrenome) {
    <span class="text-keyword">return</span> nome + <span class="text-string">" "</span> + sobrenome;
}

<span class="text-keyword">function</span> <span class="text-function-name">celsiusParaFahrenheit</span>(c) {
    <span class="text-keyword">return</span> c * <span class="text-number">1.8</span> + <span class="text-number">32</span>;
}
            </pre>
        </div>

        <!-- Área Interativa / Console -->
        <div class="flex flex-col gap-4">
            <div class="bg-bg-secondary border border-border-color rounded-xl p-6 h-full flex flex-col">
                <h2 class="text-xl mb-4 text-accent flex items-center gap-2">
                    <i class="ph ph-terminal-window"></i> Console Virtual
                </h2>
                
                <div id="console-output" class="bg-black/50 rounded-lg p-4 flex-1 font-mono text-sm text-green-400 mb-4 overflow-y-auto h-48">
                    <p class="text-gray-500">// Selecione uma função para executar...</p>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <button type="button" id="btn-run-triplo" class="bg-bg-primary border border-border-color hover:border-accent p-3 rounded-lg text-left transition-all flex items-center justify-between group">
                        <span>Executar <span class="text-function-name">triplo(5)</span></span>
                        <i class="ph ph-play-circle text-accent opacity-0 group-hover:opacity-100"></i>
                    </button>
                    <button type="button" id="btn-run-nome" class="bg-bg-primary border border-border-color hover:border-accent p-3 rounded-lg text-left transition-all flex items-center justify-between group">
                        <span>Executar <span class="text-function-name">nomeCompleto(...)</span></span>
                        <i class="ph ph-play-circle text-accent opacity-0 group-hover:opacity-100"></i>
                    </button>
                    <button type="button" id="btn-run-temp" class="bg-bg-primary border border-border-color hover:border-accent p-3 rounded-lg text-left transition-all flex items-center justify-between group">
                        <span>Executar <span class="text-function-name">celsiusParaFahrenheit(25)</span></span>
                        <i class="ph ph-play-circle text-accent opacity-0 group-hover:opacity-100"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/logger.js"></script>
    <script src="./script.js"></script>
</body>
</html>
