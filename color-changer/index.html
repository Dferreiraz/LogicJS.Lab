<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy: restringe origens de scripts, estilos e fontes -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: https://placehold.co; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Color Changer | LogicJS.Lab</title>

    <link rel="shortcut icon" href="../shared/assets/color-changer.svg" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex flex-col items-center justify-center px-4 pb-6 pt-24 sm:px-6 sm:pb-8 sm:pt-6 relative transition-colors duration-500" id="body-bg">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-4 left-4 sm:top-6 sm:left-6 inline-flex items-center gap-2 bg-bg-secondary/80 backdrop-blur border border-border-color px-4 py-3 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="bg-bg-secondary/90 backdrop-blur border border-border-color p-6 sm:p-8 rounded-2xl shadow-xl text-center max-w-md w-full">
        <h1 class="text-2xl sm:text-3xl font-bold mb-2">Trocador de Cores</h1>
        <p class="text-text-secondary mb-6 sm:mb-8">Clique no botão para mudar a cor de fundo aleatoriamente</p>
        
        <button type="button" id="btn" class="w-full bg-accent text-bg-primary font-bold py-3 px-6 rounded-lg hover:bg-accent-hover transition-all transform hover:scale-105 flex items-center justify-center gap-2 mb-6">
            <i class="ph ph-paint-brush text-xl"></i> Trocar Cor
        </button>
        
        <div class="bg-bg-primary p-4 rounded-lg border border-border-color">
            <span class="text-text-secondary">Cor de Fundo: </span>
            <span id="cor-atual" class="font-mono font-bold text-accent ml-2">#0f172a</span>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
