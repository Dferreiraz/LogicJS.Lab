<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer | LogicJS.Lab</title>

    <link rel="shortcut icon" href="./img/color-changer.svg" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0f172a',
                        'bg-secondary': '#1e293b',
                        'text-primary': '#f8fafc',
                        'text-secondary': '#94a3b8',
                        'accent': '#38bdf8',
                        'accent-hover': '#0ea5e9',
                        'border-color': '#334155',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex flex-col items-center justify-center p-6 relative transition-colors duration-500" id="body-bg">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-6 left-6 inline-flex items-center gap-2 bg-bg-secondary/80 backdrop-blur border border-border-color px-4 py-2 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="bg-bg-secondary/90 backdrop-blur border border-border-color p-8 rounded-2xl shadow-xl text-center max-w-md w-full">
        <h1 class="text-3xl font-bold mb-2">Trocador de Cores</h1>
        <p class="text-text-secondary mb-8">Clique no botão para mudar a cor de fundo aleatoriamente</p>
        
        <button id="btn" class="w-full bg-accent text-bg-primary font-bold py-3 px-6 rounded-lg hover:bg-accent-hover transition-all transform hover:scale-105 flex items-center justify-center gap-2 mb-6">
            <i class="ph ph-paint-brush text-xl"></i> Trocar Cor
        </button>
        
        <div class="bg-bg-primary p-4 rounded-lg border border-border-color">
            <span class="text-text-secondary">Cor de Fundo: </span>
            <span id="cor-atual" class="font-mono font-bold text-accent ml-2">#0f172a</span>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
