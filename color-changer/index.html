<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer | LogicJS.Lab</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="color-changer">
        <h1>Trocador de Cores</h1>
        <p>Clique no botão para mudar a cor de fundo aleatoriamente</p>
        
        <button id="btn" class="btn-primary">
            <i class="ph ph-paint-brush"></i> Trocar Cor
        </button>
        
        <div class="color-display">
            <span>Cor de Fundo: </span>
            <span id="cor-atual" class="cor-nome">Black</span>
        </div>
    </div>

    <!-- Ícones Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="./script.js"></script>
</body>
</html>
