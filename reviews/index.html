<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | LogicJS.Lab</title>

    <link rel="shortcut icon" href="./img/reviews.svg" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0f172a',
                        'bg-secondary': '#1e293b',
                        'text-primary': '#f8fafc',
                        'text-secondary': '#94a3b8',
                        'accent': '#38bdf8',
                        'accent-hover': '#0ea5e9',
                        'border-color': '#334155',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex items-center justify-center p-6 relative">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-6 left-6 inline-flex items-center gap-2 bg-bg-secondary border border-border-color px-4 py-2 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="bg-bg-secondary border border-border-color rounded-2xl shadow-xl p-8 max-w-lg w-full text-center relative">
        <div class="absolute -top-12 left-1/2 transform -translate-x-1/2">
            <img src="./assets/img/userIcon.svg" alt="Avatar" id="img" class="w-24 h-24 rounded-full border-4 border-bg-secondary bg-bg-primary object-cover">
        </div>
        
        <div class="mt-12">
            <h2 id="name" class="text-2xl font-bold mb-1">John Doe</h2>
            <p id="job" class="text-accent font-medium text-sm mb-6 uppercase tracking-wide">Web Developer</p>
            
            <p id="text" class="text-text-secondary italic mb-8 leading-relaxed">
                "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
            </p>
            
            <div class="flex justify-center items-center gap-4">
                <button id="prev-btn" class="p-3 rounded-full bg-bg-primary border border-border-color hover:bg-accent hover:text-bg-primary hover:border-accent transition">
                    <i class="ph ph-caret-left text-xl"></i>
                </button>
                
                <button id="random-btn" class="px-6 py-2 bg-border-color hover:bg-slate-500 rounded-lg text-sm font-semibold transition">
                    Surpreenda-me
                </button>
                
                <button id="next-btn" class="p-3 rounded-full bg-bg-primary border border-border-color hover:bg-accent hover:text-bg-primary hover:border-accent transition">
                    <i class="ph ph-caret-right text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
