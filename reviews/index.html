<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | LogicJS.Lab</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="review-card">
        <div class="avatar">
            <img src="./assets/img/userIcon.svg" alt="Avatar do usuário" id="img">
        </div>
        <div class="review-content">
            <h2 id="name">John Doe</h2>
            <p class="job-title" id="job">Web Developer</p>
            <p class="review-text" id="text">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            <div class="buttons">
                <button class="btn-nav" id="prev-btn">
                    <i class="ph ph-arrow-left"></i>
                </button>
                <button class="btn-random" id="random-btn">Surpreenda-me</button>
                <button class="btn-nav" id="next-btn">
                    <i class="ph ph-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="./script.js"></script>
</body>
</html>
