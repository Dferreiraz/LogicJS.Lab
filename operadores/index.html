<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy: restringe origens de scripts, estilos e fontes -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: https://placehold.co; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Operadores | LogicJS.Lab</title>
    <link rel="shortcut icon" href="../shared/assets/operadores.svg" type="image/x-icon">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex items-center justify-center p-6 relative font-mono">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-6 left-6 inline-flex items-center gap-2 bg-bg-secondary border border-border-color px-4 py-2 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Painel de Controle (Inputs) -->
        <div class="lg:col-span-1 bg-bg-secondary border border-border-color rounded-xl p-6 flex flex-col gap-6">
            <h2 class="text-xl text-accent flex items-center gap-2"><i class="ph ph-sliders"></i> Variáveis</h2>
            
            <div>
                <label class="block text-sm text-text-secondary mb-1">Valor A</label>
                <input type="number" id="val-a" value="2" class="w-full bg-bg-primary border border-border-color rounded p-2 text-white focus:border-accent outline-none">
            </div>
            
            <div>
                <label class="block text-sm text-text-secondary mb-1">Valor B</label>
                <input type="number" id="val-b" value="9" class="w-full bg-bg-primary border border-border-color rounded p-2 text-white focus:border-accent outline-none">
            </div>

            <div class="pt-4 border-t border-border-color">
                <label class="block text-sm text-text-secondary mb-2">Lógica Booleana</label>
                <div class="flex gap-4">
                    <button type="button" id="btn-choc" class="flex-1 bg-green-500/20 text-green-400 border border-green-500/50 py-2 rounded text-xs font-bold transition">Chocolate: ON</button>
                    <button type="button" id="btn-pipoca" class="flex-1 bg-red-500/20 text-red-400 border border-red-500/50 py-2 rounded text-xs font-bold transition">Pipoca: OFF</button>
                </div>
            </div>
        </div>

        <!-- Área de Resultados -->
        <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Aritmética -->
            <div class="bg-code-bg border border-border-color rounded-xl p-6">
                <h3 class="text-lg mb-4 text-accent">Aritméticos</h3>
                <div id="res-arit" class="space-y-2 text-sm text-slate-300"></div>
            </div>

            <!-- Comparação -->
            <div class="bg-code-bg border border-border-color rounded-xl p-6">
                <h3 class="text-lg mb-4 text-accent">Comparação</h3>
                <div id="res-comp" class="space-y-2 text-sm text-slate-300"></div>
            </div>

            <!-- Lógica -->
            <div class="bg-code-bg border border-border-color rounded-xl p-6 md:col-span-2">
                <h3 class="text-lg mb-4 text-accent">Lógicos</h3>
                <div id="res-log" class="space-y-2 text-sm text-slate-300"></div>
            </div>

        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
