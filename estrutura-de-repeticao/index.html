<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy: restringe origens de scripts, estilos e fontes -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: https://placehold.co; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Loops | LogicJS.Lab</title>
    <link rel="shortcut icon" href="../shared/assets/estrutura-de-repeticao.svg" type="image/x-icon">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
</head>
<body class="bg-bg-primary text-text-primary min-h-screen flex items-center justify-center p-6 relative font-mono">

    <!-- Botão Voltar -->
    <a href="../index.html" class="fixed top-6 left-6 inline-flex items-center gap-2 bg-bg-secondary border border-border-color px-4 py-2 rounded-lg font-semibold text-sm hover:bg-accent hover:text-bg-primary transition-colors z-50">
        <i class="ph ph-arrow-left"></i> Voltar ao Menu
    </a>

    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Área do Código / Visualização -->
        <div class="flex flex-col gap-4">
            <div class="bg-code-bg border border-border-color rounded-xl p-6 shadow-xl">
                <h2 class="text-xl mb-4 text-accent flex items-center gap-2">
                    <i class="ph ph-terminal-window"></i> Console de Execução
                </h2>
                <div id="console-output" class="bg-black/50 rounded-lg p-4 h-64 overflow-y-auto text-sm text-green-400 font-mono">
                    <p class="text-gray-500">// Selecione um loop para executar...</p>
                </div>
                <button type="button" id="btn-clear-console" class="mt-3 text-xs text-text-secondary hover:text-accent underline">Limpar Console</button>
            </div>
        </div>

        <!-- Área de Controles -->
        <div class="bg-bg-secondary border border-border-color rounded-xl p-6 flex flex-col gap-3">
            <h2 class="text-xl mb-2 text-accent">Tipos de Loop</h2>
            
            <button type="button" id="btn-run-counting" class="bg-bg-primary border border-border-color hover:border-accent p-3 rounded-lg text-left transition-all flex items-center justify-between group">
                <span><span class="text-method">for</span> (Contagem 0 a 10)</span>
                <i class="ph ph-play-circle text-accent opacity-0 group-hover:opacity-100"></i>
            </button>
            
            <button type="button" id="btn-run-tabuada" class="bg-bg-primary border border-border-color hover:border-accent p-3 rounded-lg text-left transition-all flex items-center justify-between group">
                <span><span class="text-method">for</span> (Tabuada do 5)</span>
                <i class="ph ph-calculator text-accent opacity-0 group-hover:opacity-100"></i>
            </button>

            <button type="button" id="btn-run-even" class="bg-bg-primary border border-border-color hover:border-accent p-3 rounded-lg text-left transition-all flex items-center justify-between group">
                <span><span class="text-method">for</span> (Pares 0 a 20)</span>
                <i class="ph ph-number-square-two text-accent opacity-0 group-hover:opacity-100"></i>
            </button>

            <button type="button" id="btn-run-countdown" class="bg-bg-primary border border-border-color hover:border-accent p-3 rounded-lg text-left transition-all flex items-center justify-between group mt-4">
                <span><span class="text-method">while</span> (Contagem Regressiva)</span>
                <i class="ph ph-timer text-accent opacity-0 group-hover:opacity-100"></i>
            </button>
        </div>
    </div>

    <script src="../shared/logger.js"></script>
    <script src="./script.js"></script>
</body>
</html>
